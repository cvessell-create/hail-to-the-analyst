name: Engine tests and source package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: hail-to-the-analyst-source
          path: dist/*.zip
