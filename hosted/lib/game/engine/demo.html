<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vessell Engine 0.1</title><style>body{background:#101713;color:#dbefda;font:16px monospace;margin:24px}canvas{width:min(100%,960px);display:block}button{padding:12px;margin:8px}pre{white-space:pre-wrap}</style><h1>Vessell Engine 0.1</h1><p>Original raycaster and collision system. WASD move; arrows turn. Licensed console CPU executes the mission commands below.</p><canvas id="view" width="960" height="540"></canvas><button id="cut">Activate grid cut</button><button id="approve">Submit complete fictional plan</button><pre id="status"></pre><p><a href="README.md">Engine scope and licences</a></p><script src="../vendor/jsnes/jsnes.cjs"></script><script src="../js/emulation-engine.js"></script><script src="core.js"></script><script>
'use strict';const engine=VessellEngine,world=engine.createWorld({grid:['#########','#.......#','#..##...#','#..#....#','#.......#','#########']}),mission=engine.createMission(0),input=engine.bindInput(window),canvas=document.getElementById('view'),ctx=canvas.getContext('2d');const clock=engine.clock(dt=>{world.turn(((input.held('ArrowRight')?1:0)-(input.held('ArrowLeft')?1:0))*dt*2);world.move((input.held('KeyW')?1:0)-(input.held('KeyS')?1:0),(input.held('KeyD')?1:0)-(input.held('KeyA')?1:0),dt*2.25);});let last=null;function frame(now){clock.advance(last===null?0:(now-last)/1000);last=now;engine.render(ctx,world,960,540);requestAnimationFrame(frame);}function status(){document.getElementById('status').textContent=JSON.stringify(mission.exportLog(),null,2);}document.getElementById('cut').onclick=()=>{mission.clearance();mission.plan(0);status();};document.getElementById('approve').onclick=()=>{mission.plan(15);status();};window.addEventListener('blur',()=>{clock.reset();last=null;});status();requestAnimationFrame(frame);
</script></html>
