(function(){
'use strict';
var cv=document.getElementById('game'),ctx=cv.getContext('2d',{alpha:false});ctx.imageSmoothingEnabled=false;
var W=960,H=540,FOV=Math.PI/3,NUM=480,zbuf=new Float32Array(NUM),keys={},state='title',levelIndex=0,last=0,acc=0,shake=0,flash=0,hurtFlash=0,muted=false,mapVisible=false,audio=null;
var overlay=document.getElementById('overlay'),card=document.getElementById('card'),touch=document.getElementById('touch');
var player,enemies=[],pickups=[],shots=[],particles=[],doors={},stats={kills:0,shots:0,hits:0,intel:0,start:0};
var campaignJack=null,breachModifiers=null,breachBase=null;
var taunts=['ANALYST DETECTED. DEPLOYING COUNTER-NARRATIVE.','YOUR CLEARANCE IS REVOKED.','WE FABRICATE. YOU VALIDATE. CUTE.','THIS NARRATIVE IS ALREADY TRENDING.'];
var levels=[
{name:'THE ARCHIVE',objective:'Recover the red clearance card. Breach the archive exit.',brief:'The Fabricators seized the national archive and buried the source trail. Recover <b>RED CLEARANCE</b>, secure any intel caches, and reach the extraction switch.',map:[
'##################','#P....#....S....X#','#.##..#..###.##R#','#..m..#...i#....#','#.##..M....#....#','#.....M.d..#..s.#','###D####.###....#','#....m.#....d...#','#..h...#..##....#','#......#..#..i..#','#.####.#..#.....#','#..b...#..#.m...#','#......D..#.....#','#..m...#..r..t..#','#......#........#','##################']},
{name:'FABRICATION PLANT',objective:'Destroy The Fabricator. Unlock the final exit.',brief:'Deep under the plant, one system manufactures every lie at scale. Acquire <b>BLUE CLEARANCE</b>, cross the production floor, and terminate THE FABRICATOR.',map:[
'####################','#P...S....#........#','#.###.###.#.##.###.#','#...d.....#..d....i#','###.#####.M.####...#','#...#...d.M....#...#','#.m.#.s.#.M.d..#...#','#...#...#.M....#...#','#.###D###.####B###.#','#...d....q.....#...#','#.###.######...#...#','#...#..m...#...#...#','#.h.#......D...#...#','#...#####..#...#...#','#..s....#..#..t#...#','#.......#..#...#...#','#..i....D......F..X#','#.......#..........#','####################']}
];
var weaponDefs=[{name:'SIDEARM',ammo:'bullets',cost:1,delay:.28,damage:24,pellets:1,spread:.012},{name:'BREACHER',ammo:'shells',cost:1,delay:.82,damage:14,pellets:7,spread:.16},{name:'REDACTOR',ammo:'bullets',cost:1,delay:.09,damage:10,pellets:1,spread:.035}];
var map=[],mw=0,mh=0,message='',messageT=0,levelTime=0,bossDead=false,lowSaid=false,firstKill=false;
function setMessage(s,t){message=s;messageT=t||2.3}
function tone(type){if(muted)return;if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();var now=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);var f=220,d=.1,kind='square';if(type==='shot'){f=125;d=.08}else if(type==='boom'){f=72;d=.24}else if(type==='hurt'){f=58;d=.16}else if(type==='pick'){f=520;d=.15;kind='sine'}else if(type==='intel'){f=660;d=.34;kind='square'}else if(type==='door'){f=90;d=.3;kind='sawtooth'}else if(type==='boss'){f=44;d=.75;kind='sawtooth'}else if(type==='death'){f=170;d=.6;kind='sawtooth'}else if(type==='exit'){f=320;d=.5;kind='sine'}o.type=kind;o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(type==='death'?45:f*1.45,now+d);g.gain.setValueAtTime(.11,now);g.gain.exponentialRampToValueAtTime(.001,now+d);o.start();o.stop(now+d)}
function title(){state='title';overlay.classList.remove('hidden');touch.classList.remove('active');card.innerHTML='<div class="kicker">STRATEGIC INTELLIGENCE // EYES ONLY</div><h1 class="title">HAIL TO THE<span>ANALYST</span></h1><div class="brief"><b>THE FABRICATORS</b> seized the Archive. You are Jack Slade, SI operative—armed with a sidearm, a healthy distrust of trending narratives, and one order: trace the source. Break the network. Verify everything.</div><button class="action" id="primary">DEPLOY</button><div class="small desktop"><span class="keys">WASD</span> move · <span class="keys">← →</span> turn · <span class="keys">SPACE / CLICK</span> fire · <span class="keys">E</span> use · <span class="keys">1–3</span> weapons · <span class="keys">M</span> map</div><div class="small">Touch controls appear automatically on iPhone. Audio initializes on deploy.</div>';document.getElementById('primary').onclick=function(){initAudio();briefing(0)}}
function briefing(i){levelIndex=i;state='brief';overlay.classList.remove('hidden');touch.classList.remove('active');var L=levels[i];card.innerHTML='<div class="kicker">MISSION '+(i+1)+' OF 2 // '+L.objective+'</div><h2 class="title" style="font-size:clamp(36px,7vw,72px)">'+L.name+'</h2><div class="brief">'+L.brief+'<br><br><b>CHATTER ENGINE:</b> Threat traffic indicates coordinated narrative activity. Expect hostile attribution and low-quality sourcing.</div><button class="action" id="primary">TACTICAL APPROACH</button>';document.getElementById('primary').onclick=function(){startTactics(i)}}
function startTactics(i){
  state='tactical';
  keys={};touchInput.active=false;touchInput.fire=false;touchInput.dx=touchInput.dy=0;
  if(i===0)campaignJack=null;
  TacticalUI.start(card,i,campaignJack,function(modifiers,jack){
    campaignJack=jack;breachModifiers=modifiers;
    breachBase=i&&player?{armor:player.armor,bullets:player.bullets,shells:player.shells,weapon:player.weapon}:null;
    loadLevel(i);
  });
}
function parseMap(L){map=L.map.map(function(r){return r.split('')});mh=map.length;mw=map[0].length;enemies=[];pickups=[];shots=[];particles=[];doors={};for(var y=0;y<mh;y++)for(var x=0;x<mw;x++){var c=map[y][x];if(c==='P'){player.x=x+.5;player.y=y+.5;map[y][x]='.'}else if('mdtF'.indexOf(c)>=0){spawnEnemy(c,x+.5,y+.5);map[y][x]='.'}else if('hasirq'.indexOf(c)>=0){pickups.push({type:c,x:x+.5,y:y+.5,alive:true,bob:Math.random()*6.2});map[y][x]='.'}else if('DRB'.indexOf(c)>=0){doors[x+','+y]={open:0,type:c}}}}
function loadLevel(i){
  var base=breachBase||{armor:0,bullets:45,shells:8,weapon:0};
  var bonus=breachModifiers||{armor:0,bullets:0,shells:0,extraEnemies:0};
  player={x:1.5,y:1.5,a:0,hp:100,armor:Math.min(100,Math.max(0,base.armor)+bonus.armor),
    bullets:Math.max(45,base.bullets)+bonus.bullets,shells:Math.max(8,base.shells)+bonus.shells,
    weapon:base.weapon,cool:0,bob:0,kick:0,red:false,blue:false};
  bossDead=false;lowSaid=false;parseMap(levels[i]);
  var reinforcements=[];
  for(var y=0;y<mh;y++)for(var x=0;x<mw;x++){
    if(map[y][x]==='.'&&Math.hypot(x+.5-player.x,y+.5-player.y)>3&&
      !enemies.some(function(e){return e.x===x+.5&&e.y===y+.5}))reinforcements.push({x:x+.5,y:y+.5});
  }
  for(var n=0;n<bonus.extraEnemies&&n<reinforcements.length;n++)spawnEnemy('m',reinforcements[n].x,reinforcements[n].y);
  keys={};touchInput.fire=false;state='play';overlay.classList.add('hidden');touch.classList.add('active');levelTime=0;
  if(!stats.start)stats.start=performance.now();
  setMessage(i===0?"IT'S TIME TO KICK ASS AND VERIFY SOURCES.":'FIND THE SOURCE. END THE STORY.',3.8);
}
function spawnEnemy(c,x,y){var type=c==='m'?'MOLE':c==='d'?'DRONE':c==='t'?'TROLL':'FABRICATOR';var hp=type==='MOLE'?42:type==='DRONE'?62:type==='TROLL'?125:520;enemies.push({type:type,x:x,y:y,hp:hp,max:hp,alive:true,seen:false,cool:.5+Math.random(),pain:0,phase:Math.random()*6.2,death:0})}
function solid(x,y){var X=Math.floor(x),Y=Math.floor(y);if(X<0||Y<0||X>=mw||Y>=mh)return true;var c=map[Y][X];if(c==='.'||c==='X')return false;if('DRB'.indexOf(c)>=0){var d=doors[X+','+Y];return !d||d.open<.88}return true}
function moveEntity(o,dx,dy,r){r=r||.22;if(!solid(o.x+dx+Math.sign(dx)*r,o.y))o.x+=dx;if(!solid(o.x,o.y+dy+Math.sign(dy)*r))o.y+=dy}
function hasLOS(a,b){var dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy),steps=Math.ceil(dist*8);for(var i=1;i<steps;i++)if(solid(a.x+dx*i/steps,a.y+dy*i/steps))return false;return true}
function use(){if(state!=='play')return;var fx=Math.floor(player.x+Math.cos(player.a)*.85),fy=Math.floor(player.y+Math.sin(player.a)*.85),c=map[fy]&&map[fy][fx];if('DRB'.indexOf(c)>=0){if((c==='R'&&!player.red)||(c==='B'&&!player.blue)){setMessage('KEYCARD. OF COURSE IT\'S A KEYCARD.');tone('hurt');return}doors[fx+','+fy].open=1;map[fy][fx]='.';tone('door');setMessage('ACCESS GRANTED.')}else if(c==='X'){if(levelIndex===0&&!player.red){setMessage('RED CLEARANCE REQUIRED.');tone('hurt')}else if(levelIndex===1&&!bossDead){setMessage('THE FABRICATOR IS STILL TRANSMITTING.');tone('hurt')}else finishLevel()}else setMessage('NO ACTIONABLE INTELLIGENCE.')}
function finishLevel(){tone('exit');if(levelIndex===0){state='brief';setMessage('SOURCES VERIFIED. MOVING ON.');overlay.classList.remove('hidden');touch.classList.remove('active');card.innerHTML='<div class="kicker">ARCHIVE SECURED</div><h2 class="title" style="font-size:clamp(38px,7vw,76px)">SOURCES<br>VERIFIED.</h2><div class="brief">The archive trail leads below the Fabrication Plant. The chatter isn\'t slowing down—someone is still writing the script.</div><button class="action" id="primary">DESCEND</button>';document.getElementById('primary').onclick=function(){briefing(1)}}else victory()}
function victory(){state='victory';overlay.classList.remove('hidden');touch.classList.remove('active');var sec=Math.floor((performance.now()-stats.start)/1000),accu=stats.shots?Math.round(stats.hits/stats.shots*100):0,rank=accu>=60&&player.hp>=60?'S':accu>=40?'A':accu>=25?'B':'C';card.innerHTML='<div class="kicker">FINAL ASSESSMENT // MISSION COMPLETE</div><h2 class="title" style="font-size:clamp(48px,9vw,94px)">RANK '+rank+'</h2><div class="brief" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><span>TIME</span><b>'+Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')+'</b><span>HOSTILES REDACTED</span><b>'+stats.kills+'</b><span>ACCURACY</span><b>'+accu+'%</b><span>INTEL SCORE</span><b>'+stats.intel.toLocaleString()+'</b></div><div class="small" style="font-size:15px;color:#fff;margin-bottom:15px">“The truth was out there. I kicked the door in.”</div><button class="action" id="primary">RUN IT AGAIN</button>';document.getElementById('primary').onclick=function(){stats={kills:0,shots:0,hits:0,intel:0,start:0};briefing(0)}}
function die(){if(state!=='play')return;state='dead';tone('death');overlay.classList.remove('hidden');touch.classList.remove('active');card.innerHTML='<div class="kicker">SIGNAL LOST</div><h2 class="title" style="font-size:clamp(44px,8vw,88px)">CASE CLOSED.</h2><div class="brief" style="text-align:center">Should\'ve checked the source.</div><button class="action" id="primary">RESTART MISSION</button>';document.getElementById('primary').onclick=function(){loadLevel(levelIndex)}}
function fire(){if(state!=='play'||player.cool>0)return;var wd=weaponDefs[player.weapon],ammo=wd.ammo;if(player[ammo]<wd.cost){setMessage('EMPTY. THAT SOURCE IS DRY.');tone('hurt');player.cool=.25;return}player[ammo]-=wd.cost;player.cool=wd.delay;player.kick=1;flash=.07;stats.shots++;tone(player.weapon===1?'boom':'shot');var any=false;for(var p=0;p<wd.pellets;p++){var ang=player.a+(Math.random()-.5)*wd.spread,closest=null,cd=99;for(var i=0;i<enemies.length;i++){var e=enemies[i];if(!e.alive)continue;var dx=e.x-player.x,dy=e.y-player.y,dist=Math.hypot(dx,dy),da=Math.atan2(Math.sin(Math.atan2(dy,dx)-ang),Math.cos(Math.atan2(dy,dx)-ang));var size=(e.type==='FABRICATOR'?0.8:0.35)/Math.max(dist,.1);if(Math.abs(da)<size&&dist<cd&&hasLOS(player,e)){closest=e;cd=dist}}if(closest){any=true;var dmg=wd.damage*(.82+Math.random()*.35);closest.hp-=dmg;closest.pain=.12;if(closest.hp<=0)killEnemy(closest)}}if(any)stats.hits++}
function killEnemy(e){if(!e.alive)return;e.alive=false;e.death=.8;stats.kills++;stats.intel+=e.type==='FABRICATOR'?3000:e.type==='TROLL'?350:150;tone('death');for(var i=0;i<9;i++)particles.push({x:e.x,y:e.y,z:.7,vx:(Math.random()-.5)*.8,vy:(Math.random()-.5)*.8,vz:Math.random()*1.4+.2,t:1+Math.random()*.7,label:i<3?'[REDACTED]':''});if(e.type==='FABRICATOR'){bossDead=true;setMessage('THE FABRICATION LINE IS OFFLINE.',4);tone('exit')}else if(!firstKill){firstKill=true;setMessage('HAIL TO THE ANALYST, BABY.',3)}if(Math.random()<.28)pickups.push({type:'b',x:e.x,y:e.y,alive:true,bob:0})}
function damage(n){var absorb=Math.min(player.armor,n/3);player.armor-=absorb;player.hp-=n-absorb;hurtFlash=.35;shake=.2;tone('hurt');if(player.hp<=0){player.hp=0;die()}else if(player.hp<25&&!lowSaid){lowSaid=true;setMessage("I'M NOT GOING OUT LIKE AN UNVERIFIED RUMOR.",3)}}
function cycleWeapon(){player.weapon=(player.weapon+1)%3;setMessage(weaponDefs[player.weapon].name)}
function update(dt){if(state!=='play')return;levelTime+=dt;player.cool=Math.max(0,player.cool-dt);player.kick=Math.max(0,player.kick-dt*6);flash=Math.max(0,flash-dt);hurtFlash=Math.max(0,hurtFlash-dt);shake=Math.max(0,shake-dt);messageT=Math.max(0,messageT-dt);
var f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0),turn=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);if(touchInput.active){f=-touchInput.dy;s=touchInput.dx}player.a+=turn*2.15*dt;var speed=(keys.ShiftLeft||keys.ShiftRight?3.4:2.25)*dt;if(f||s){var len=Math.max(1,Math.hypot(f,s));moveEntity(player,(Math.cos(player.a)*f+Math.cos(player.a+Math.PI/2)*s)/len*speed,(Math.sin(player.a)*f+Math.sin(player.a+Math.PI/2)*s)/len*speed,.18);player.bob+=dt*10}else player.bob+=dt*2;if(keys.Space||keys.ControlLeft||touchInput.fire)fire();
